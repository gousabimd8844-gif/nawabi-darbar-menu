  if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&n=='\n')i++;row.push(cell);cell="";if(row.some(x=>x!==""))rows.push(row);row=[];continue}
  cell+=ch;
 }
 if(cell!==""||row.length){row.push(cell);rows.push(row)}
 if(!rows.length)return [];
 const headers=rows.shift().map(x=>x.trim());
 return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}
function num(v){let x=parseFloat(String(v).replace(/[^\d.-]/g,""));return Number.isFinite(x)?x:null}
function money(v){let n=num(v);if(n===null||v==="")return "";return "₹"+(Number.isInteger(n)?n:n.toFixed(2))}
function render(data){
 const cats={};
 data.filter(r=>String(r["Category Active"]).toUpperCase()!=="NO" && String(r["Item Active"]).toUpperCase()!=="NO")
 .forEach(r=>{const c=r.Category||"Other";(cats[c]??=[]).push(r)});
 const sortedCats=Object.entries(cats).sort((a,b)=>(num(a[1][0]["Category Order"])??999)-(num(b[1][0]["Category Order"])??999));
 document.getElementById("menu").innerHTML=sortedCats.map(([cat,items])=>{
  items.sort((a,b)=>(num(a["Item Order"])??999)-(num(b["Item Order"])??999));
  return `<section class="category"><h2>${esc(cat)} <span>${items.length}</span></h2>`+
  items.map(r=>{let ps=[["Regular",r["Regular Price"]],["Half",r["Half Price"]],["Quarter",r["Quarter Price"]]].filter(x=>x[1]!==""&&x[1]!=null);
   return `<div class="item"><div class="item-name">${esc(r.Item)}</div><div class="prices">${ps.map(([l,v])=>`<span class="price"><small>${l}</small>${money(v)}</span>`).join("")}</div></div>`}).join("")+
  `</section>`;
 }).join("");
 document.getElementById("status").textContent=`${data.filter(r=>String(r["Item Active"]).toUpperCase()!=="NO").length} items`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render(fallback);
fetch("./menu.csv?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>render(parseCSV(t))).catch(()=>{});
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();
 document.querySelectorAll(".category").forEach(sec=>{let any=false;sec.querySelectorAll(".item").forEach(it=>{let ok=it.innerText.toLowerCase().includes(q);it.classList.toggle("hidden",!ok);if(ok)any=true});sec.classList.toggle("hidden",!any)})
});
</script>
